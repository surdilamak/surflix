# =====================================================
# Surflix · Docker Compose
# Deploy to Unraid (or any Docker host)
#
# Usage:
# 1. Copy .env.example to .env, fill in all values
# 2. docker compose up -d --build
#
# Assumption: Jellyseerr is already running in the 'jellyseerr' container
#         in the same network (or adjust JELLYSEERR_URL)
# =====================================================

services:
  surflix:
    build: .
    container_name: surflix
    restart: unless-stopped

    ports:
      # Expose on host port 3737 (change if it conflicts)
      # The reverse proxy will forward request.surdilamak.my.id here
      - "3737:3000"

    environment:
      # Load everything from .env
      NODE_ENV: production
      DATABASE_URL: file:/data/surflix.db
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Surflix}
      NEXT_PUBLIC_JELLYFIN_URL: ${NEXT_PUBLIC_JELLYFIN_URL}

      # Jellyseerr (internal Docker network)
      JELLYSEERR_URL: ${JELLYSEERR_URL:-http://jellyseerr:5055}
      JELLYSEERR_API_KEY: ${JELLYSEERR_API_KEY}

      # Auth
      SESSION_SECRET: ${SESSION_SECRET}
      VIEWER_COOKIE_DOMAIN: ${VIEWER_COOKIE_DOMAIN:-}
      SSO_SHARED_SECRET: ${SSO_SHARED_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}

      # Rate limit
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-3600000}

      # Webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}

    volumes:
      # Persistent SQLite database
      - ./data:/data
      # Optional: if you want to persist the Prisma migrations history
      # - ./prisma/migrations:/app/prisma/migrations

    networks:
      - surflix-net
      # Make sure Jellyseerr is also on this network, or you can use
      # the same external network (see the notes below)

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      # For Traefik (if you use it), uncomment the lines below:
      # - "traefik.enable=true"
      # - "traefik.http.routers.surflix.rule=Host(`request.surdilamak.my.id`)"
      # - "traefik.http.routers.surflix.entrypoints=websecure"
      # - "traefik.http.routers.surflix.tls.certresolver=letsencrypt"
      # - "traefik.http.services.surflix.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  surflix-net:
    driver: bridge

# =====================================================
# NOTES FOR UNRAID
# =====================================================
#
# 1. JELLYSEERR NETWORK
#    If your Jellyseerr is already running on its own network, there are 2 options:
#
#    Option A — Join Jellyseerr to the surflix-net network:
#      docker network connect surflix_surflix-net jellyseerr
#
#    Option B — Use the Jellyseerr network as an external network:
#      Edit the networks block above to:
#        networks:
#          jellyseerr_default:
#            external: true
#      And change JELLYSEERR_URL to http://jellyseerr:5055
#
# 2. REVERSE PROXY (SWAG / Nginx Proxy Manager)
#    Add a new config for request.surdilamak.my.id
#    → forward to http://<unraid-ip>:3737
#
# 3. SSL
#    Auto-handled by your reverse proxy (LetsEncrypt via SWAG/NPM)
#
# 4. BACKUP
#    Back up the ./data folder to save the SQLite database.
#    You can use the CA Backup plugin on Unraid.
